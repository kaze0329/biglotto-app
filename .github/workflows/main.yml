name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  # 消除 Node.js 20 deprecated 警告，強制使用 Node.js 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定雲端 Windows Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件與 PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib pyinstaller

      - name: 打包為單一免安裝 EXE 執行檔
        run: |
          python -m PyInstaller --noconsole --onefile --name "台灣大樂透預測分析系統" biglotto_gui.py

      - name: 產出下載包
        uses: actions/upload-artifact@v4
        with:
          name: BigLotto_Windows_EXE
          path: dist/台灣大樂透預測分析系統.exe
