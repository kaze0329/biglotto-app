name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib pyinstaller

      - name: Build EXE with PyInstaller
        shell: cmd
        run: |
          dir
          python -m PyInstaller --onefile --clean --collect-all matplotlib --collect-all pandas --name "BigLottoPredictor" biglotto_gui.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v5
        with:
          name: BigLotto_Windows_EXE
          path: dist/BigLottoPredictor.exe
